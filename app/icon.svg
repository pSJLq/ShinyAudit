<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark square base -->
  <rect width="32" height="32" fill="#070707"/>
  <!-- pixel-grid noise (subtle, matches brand) -->
  <rect x="4"  y="4"  width="2" height="2" fill="#5601bf" opacity="0.55"/>
  <rect x="26" y="6"  width="2" height="2" fill="#6e6eed" opacity="0.55"/>
  <rect x="6"  y="26" width="2" height="2" fill="#6e6eed" opacity="0.55"/>
  <rect x="24" y="24" width="2" height="2" fill="#5601bf" opacity="0.55"/>
  <!-- magnifying glass: ring + handle -->
  <circle cx="13" cy="13" r="6.5" fill="none" stroke="#f5f5f5" stroke-width="2"/>
  <!-- pupil / scanned target inside the lens -->
  <rect x="11" y="11" width="4" height="4" fill="#5601bf"/>
  <!-- handle -->
  <line x1="18" y1="18" x2="26" y2="26" stroke="#f5f5f5" stroke-width="2.4" stroke-linecap="square"/>
  <!-- scan glow corner -->
  <rect x="22" y="22" width="2" height="2" fill="#00a35e"/>
</svg>
