<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect width="180" height="180" rx="32" fill="#070707"/>
  <!-- subtle grid background -->
  <g opacity="0.35">
    <rect x="20"  y="20"  width="8" height="8" fill="#5601bf"/>
    <rect x="40"  y="20"  width="8" height="8" fill="#6e6eed" opacity="0.5"/>
    <rect x="152" y="32"  width="8" height="8" fill="#6e6eed"/>
    <rect x="20"  y="148" width="8" height="8" fill="#6e6eed"/>
    <rect x="140" y="148" width="8" height="8" fill="#5601bf"/>
  </g>
  <!-- magnifying glass: ring + handle -->
  <circle cx="74" cy="74" r="38" fill="none" stroke="#f5f5f5" stroke-width="11"/>
  <rect x="64" y="64" width="20" height="20" fill="#5601bf"/>
  <line x1="105" y1="105" x2="148" y2="148" stroke="#f5f5f5" stroke-width="13" stroke-linecap="square"/>
  <rect x="138" y="138" width="10" height="10" fill="#00a35e"/>
