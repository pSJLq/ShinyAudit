<html lang="en">
<head>

  <title>{s}hinyAudit · agentic on-chain investigator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* idle easter-egg — soft {s} silhouette pulse */
    body.idle::before {
      content: "{s}";
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Geist Mono", monospace;
      font-size: 40vh;
      color: rgba(167, 139, 250, 0.04);
      pointer-events: none;
      z-index: 0;
      animation: idleFade 3.4s ease-in-out 1;
      letter-spacing: -0.04em;
    }
    @keyframes idleFade {
      0% { opacity: 0; }
      40% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
